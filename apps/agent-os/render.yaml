services:
  - type: web
    name: lixen-agent-os
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: LIXEN_ENV
        value: production
      - key: GHL_API_KEY
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
      - key: GOOGLE_DRIVE_CREDENTIALS
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: GMAIL_CREDENTIALS
        sync: false
      - key: GMAIL_FROM_EMAIL
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_DEFAULT_CHANNEL
        value: "#general"
      - key: CALENDAR_CREDENTIALS
        sync: false
      - key: CALENDAR_ID
        value: primary
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
